<?xml version="1.0" encoding="UTF-8"?>
<!--
  ===========================================================================
  LOGO DEL EDITOR ASM  ·  fuente de diseño
  ===========================================================================

  Este archivo es la FUENTE DE DISEÑO, no un recurso que el programa cargue.

  ⚠ WinForms NO DIBUJA SVG: no tiene soporte nativo y agregar una biblioteca
    que lo rasterice (Svg.NET, SkiaSharp) sería varios MB de dependencia para
    un dibujo de cuarenta líneas. Lo que la aplicación ejecuta es el código
    GDI+ de `LogoEditor.cs`, con ESTAS MISMAS COORDENADAS.

  ⚠ SI SE TOCA ESTE ARCHIVO HAY QUE TOCAR `LogoEditor.cs` TAMBIÉN. Son dos
    archivos en dos lenguajes; no hay forma de que uno lea al otro. Las
    coordenadas están anotadas al lado de cada pieza para poder compararlas.

  Para qué sirve entonces:
    · editarlo en Inkscape o Illustrator si hay que retocar el dibujo;
    · exportar el .ico multi-tamaño (ver `recursos/LEEME.md`);
    · usarlo en documentación, README o cualquier cosa fuera de la app.

  ---------------------------------------------------------------------------
  EL CONCEPTO: un ensamblador traduce texto a bytes para un procesador.

    1. EL CHIP    cuadrado con patas: la silueta que se reconoce a 16 px.
    2. LA «A»     de Assembler, con ángulos duros: grabada, no escrita.
    3. LOS BITS   1-1-0 debajo: lo que sale del ensamblado.

  NO es «</>»: ese chevron es el símbolo genérico de «programación» y lo usa
  medio mundo; no identifica a nada.

  ---------------------------------------------------------------------------
  COLORES
    #D4A017  acento — el dorado de Trapezoide, que identifica estos sistemas
    #9AA3B0  trazo  — gris neutro, legible sobre fondo claro y oscuro

  GRILLA: 32 × 32, igual que el código.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256" viewBox="0 0 32 32"
     shape-rendering="geometricPrecision">

  <title>Editor ASM</title>
  <desc>Un chip con la letra A de Assembler y los bits 1-1-0 que salen del ensamblado.</desc>

  <defs>
    <style>
      .acento { stroke: #D4A017; fill: none; stroke-linecap: round; }
      .trazo  { stroke: #9AA3B0; fill: none; stroke-linecap: round; }
      .relleno{ fill: #9AA3B0; }
    </style>
  </defs>

  <!-- ── 1. Patas del chip ──────────────────────────────────────────────
       GDI+: bucle sobre 11, 16, 21 con los cuatro lados.
       Van primero para que el cuerpo las tape donde se juntan. -->
  <g class="trazo" stroke-width="1.6">
    <!-- arriba -->
    <line x1="11" y1="3" x2="11" y2="6.5"/>
    <line x1="16" y1="3" x2="16" y2="6.5"/>
    <line x1="21" y1="3" x2="21" y2="6.5"/>
    <!-- abajo -->
    <line x1="11" y1="25.5" x2="11" y2="29"/>
    <line x1="16" y1="25.5" x2="16" y2="29"/>
    <line x1="21" y1="25.5" x2="21" y2="29"/>
    <!-- izquierda -->
    <line x1="3" y1="11" x2="6.5" y2="11"/>
    <line x1="3" y1="16" x2="6.5" y2="16"/>
    <line x1="3" y1="21" x2="6.5" y2="21"/>
    <!-- derecha -->
    <line x1="25.5" y1="11" x2="29" y2="11"/>
    <line x1="25.5" y1="16" x2="29" y2="16"/>
    <line x1="25.5" y1="21" x2="29" y2="21"/>
  </g>

  <!-- ── 2. Cuerpo del chip ─────────────────────────────────────────────
       GDI+: R(6,6,20,20) con radio 3, relleno con el acento al 11 % (28/255). -->
  <rect x="6" y="6" width="20" height="20" rx="3" ry="3"
        fill="#D4A017" fill-opacity="0.11"
        stroke="#D4A017" stroke-width="2" stroke-linejoin="round"/>

  <!-- ── 3. La «A» de Assembler ─────────────────────────────────────────
       GDI+ (con detalle): vértices (12.2,20) (16,11.2) (19.8,20)
                           travesaño  (13.7,16.6) → (18.3,16.6)
       El vértice va en punta (miter), no redondeado: se lee grabado. -->
  <g class="acento" stroke-width="2.2" stroke-linejoin="miter">
    <polyline points="12.2,20 16,11.2 19.8,20"/>
    <line x1="13.7" y1="16.6" x2="18.3" y2="16.6"/>
  </g>

  <!-- ── 4. Los bits que salen ──────────────────────────────────────────
       GDI+: lado 2.0, paso 3.4, centrados en x=16 → x0 = 16-(6.8+2)/2 = 11.6
       1 - 1 - 0: dos llenos y uno vacío. -->
  <g>
    <rect class="relleno" x="11.6" y="22.3" width="2" height="2"/>
    <rect class="relleno" x="15.0" y="22.3" width="2" height="2"/>
    <rect x="18.4" y="22.3" width="2" height="2"
          fill="none" stroke="#9AA3B0" stroke-width="1"/>
  </g>
</svg>
